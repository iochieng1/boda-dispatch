# Render Blueprint: https://render.com/docs/blueprint-spec
# Only the API runs on Render. The Next.js dashboard (apps/web) deploys to
# Vercel; set CORS_ORIGINS below to its URL.
services:
  - type: web
    name: boda-dispatch-server
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: CORS_ORIGINS
        sync: false # e.g. https://boda-dispatch.vercel.app
      - key: DATABASE_URL
        fromDatabase:
          name: boda-dispatch-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: boda-dispatch-redis
          property: connectionString

  - type: keyvalue
    name: boda-dispatch-redis
    plan: free
    ipAllowList: [] # only reachable from services in this Render account

databases:
  - name: boda-dispatch-db
    plan: free
